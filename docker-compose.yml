services:
  ha-core:
    build:
      context: ./packages/ha-core
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development

  client-app:
    build:
      context: ./packages/client-app
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development

  operator-app:
    build:
      context: ./packages/operator-app
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=development
