# ============================================================
# Smart Home Platform -- nginx site config (Pi / Linux)
# Deployed to /etc/nginx/sites-available/smarthome.conf and
# symlinked into /etc/nginx/sites-enabled/ by pi-setup.sh.
#
# Layout:
#   :80   -> client-app static dist  (+ /api proxy to ha-core)
#   :3002 -> operator-app static dist (+ /api proxy to ha-core)
#   ha-core itself listens on 127.0.0.1:3001 (the upstream).
#
# IMPORTANT (port 3001): ha-core OWNS port 3001 as its own
# listener (see the ha-core.service systemd unit). nginx does
# NOT add a second listener on 3001 -- two processes cannot bind
# the same port. Instead nginx reaches ha-core as an upstream on
# 127.0.0.1:3001 via the /api/ locations below. This is the
# "nginx -> ha-core proxy with SSE" requirement from the spec.
#
# KNOWN ISSUE (SETUP.md #4): the ha-core SSE proxy MUST set
# proxy_buffering off + proxy_read_timeout 3600 + correct
# Connection/Upgrade headers, or live tile updates stop arriving.
# That config lives in the "location /api/events" blocks below.
# ============================================================

# WebSocket/upgrade map (http context). ha-core's browser transport
# is SSE, but this keeps any future upgrade endpoint working too.
# For plain HTTP requests $connection_upgrade resolves to "" (empty),
# which is exactly what SSE needs (no "close", no "keep-alive").
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# Shared upstream: ha-core REST + SSE on loopback.
upstream ha_core {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ------------------------------------------------------------
# client-app -- homeowner PWA on :80
# ------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/smarthome-platform/packages/client-app/dist;
    index index.html;

    # SPA: unknown paths fall back to index.html (React Router owns them).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE stream. Must come BEFORE the generic /api/ block so it wins.
    # Trailing slash on proxy_pass strips the /api prefix: the browser
    # calls /api/events, ha-core receives /events.
    location = /api/events {
        proxy_pass http://ha_core/events;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        '';
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE essentials -- without these, live updates break.
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600;
        chunked_transfer_encoding off;
    }

    # All other ha-core REST calls. /api/entities -> ha-core /entities.
    location /api/ {
        proxy_pass http://ha_core/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------
# operator-app -- installer dashboard on :3002
# ------------------------------------------------------------
server {
    listen 3002;
    listen [::]:3002;
    server_name _;

    root /opt/smarthome-platform/packages/operator-app/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/events {
        proxy_pass http://ha_core/events;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        '';
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://ha_core/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
